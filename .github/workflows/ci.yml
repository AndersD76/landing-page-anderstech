name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Check syntax (todos os JS versionados)
        run: |
          git ls-files '*.js' | grep -v '^node_modules/' | while read f; do
            [ -f "$f" ] || continue
            node --check "$f" || exit 1
          done

      - name: Testes
        run: npm test

      - name: Verify required files exist
        run: |
          test -f index.html
          test -f styles.css
          test -f app.js
          test -f robots.txt
          test -f portal/login.html
          test -f portal/admin.html
          test -f portal/cliente.html

      - name: npm audit (critical/high)
        run: npm audit --omit=dev --audit-level=high

      - name: Check for .env leaks
        run: |
          if git diff --cached --name-only 2>/dev/null | grep -q '\.env$'; then
            echo "ERROR: .env file staged for commit"
            exit 1
          fi
          echo "No .env leaks detected"

      - name: Secret scan (grep for common patterns)
        run: |
          echo "Scanning for hardcoded secrets..."
          FOUND=0
          for pattern in 'AKIA[0-9A-Z]{16}' 'sk-[a-zA-Z0-9]{32,}' 'ghp_[a-zA-Z0-9]{36}' 're_[a-zA-Z0-9_]{20,}'; do
            if grep -rn --include='*.js' --include='*.html' --include='*.json' -E "$pattern" . --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
              echo "WARN: possible secret matching $pattern"
              FOUND=1
            fi
          done
          if [ "$FOUND" = "1" ]; then
            echo "::warning::Possible hardcoded secrets found — review above matches"
          fi
          echo "Secret scan complete"

      - name: Ping IndexNow (on push to master only)
        if: github.event_name == 'push'
        run: |
          # Antes: 8 URLs fixas escritas a mao, enquanto o sitemap tem 123.
          # Agora le o proprio sitemap, entao conteudo novo sempre e notificado.
          # /sitemap.xml virou índice por tipo (18/11/2026): lê cada parte.
          URLS=$(for parte in $(curl -s https://anderstech.net/sitemap.xml | grep -o '<loc>[^<]*</loc>' | sed 's|<loc>||;s|</loc>||'); do
                   curl -s "$parte" | grep -o '<loc>[^<]*</loc>' | sed 's|<loc>||;s|</loc>||'; done | head -10000 | jq -R . | jq -s .)
          COUNT=$(echo "$URLS" | jq 'length')
          echo "Notificando IndexNow: $COUNT URLs"
          curl -s -X POST "https://api.indexnow.org/indexnow"             -H "Content-Type: application/json"             -d "$(jq -n --argjson u "$URLS" '{
                  host: "anderstech.net",
                  key: "c310f106aad0297668046237775e3dc3",
                  keyLocation: "https://anderstech.net/c310f106aad0297668046237775e3dc3.txt",
                  urlList: $u }')" || echo "IndexNow ping falhou (nao bloqueante)"

  # ── Portão de segurança e qualidade (18/11/2026) ─────────────────────────────
  # Merge bloqueado só por: testes (inclui seguranca.test.js e urls.test.js de
  # SEO), fumaça E2E, Semgrep em severidade ERROR, audit crítico/alto, gitleaks
  # e orçamento do Lighthouse nas páginas de conversão.

  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Gitleaks no histórico inteiro
        run: |
          curl -sSL -o gl.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          tar -xzf gl.tgz gitleaks
          ./gitleaks git . --config .gitleaks.toml --redact --no-banner

  semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: python3 -m pip install --quiet semgrep==1.186.0
      - name: Semgrep (bloqueia só severidade ERROR)
        run: semgrep scan --config p/javascript --config p/expressjs --config p/secrets --metrics=off --severity ERROR --error --exclude node_modules --exclude 'ead/seed*.js'

  integracao:
    # Servidor inteiro sobre Postgres real em memória (PGlite): migrações,
    # semeadura, painéis, leads, conversões, parceiros, iscas, WhatsApp,
    # outbound, régua e rotinas. Pegou 3 bugs que os testes de unidade não viam.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run test:integracao

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Fumaça E2E (desktop e celular; falha com erro no console)
        run: node scripts/fumaca-e2e.mjs

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - name: Lighthouse com orçamento nas páginas de conversão
        run: |
          PORT=3001 NODE_ENV=development npm start &
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3001/robots.txt >/dev/null && break; sleep 1; done
          npx --yes @lhci/cli@0.14.0 autorun --config=lighthouserc.json
